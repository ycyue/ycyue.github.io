title: plong's blog
subtitle: 记录 AI 学习、技术实践与日常思考
description: plong 的个人博客
keywords: 思考,成长,AI,Python
author: plong
language: zh-cn
timezone: Asia/Shanghai

url: https://ycyue.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false
prismjs:
  enable: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date
archive_generator:
  per_page: 0
category_generator:
  per_page: 10
  enable_index_page: true
tag_generator:
  per_page: 10
  enable_index_page: true
feed:
  type: atom
  path: atom.xml
  limit: 20

theme: typography

prism_plugin:
  mode: preprocess
  theme: default
  line_number: true

deploy:
  type: ''
