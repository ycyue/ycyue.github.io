      <text x="100" y="190" text-anchor="middle" fill="#e0f1ef" font-size="16">功能测试项目</text>
      <text x="100" y="222" text-anchor="middle" fill="#e0f1ef" font-size="16">接口自动化项目</text>
      <text x="100" y="254" text-anchor="middle" fill="#e0f1ef" font-size="16">简历与面试表达</text>
    </g>
