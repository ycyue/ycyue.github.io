<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">软件测试五阶段学习路线</title>
  <desc id="desc">从测试基础、工具与Web测试、数据库Linux与接口测试、Python自动化到项目与求职。</desc>
  <rect width="1200" height="520" rx="32" fill="#f7f1e6"/>
  <text x="64" y="72" fill="#102f4c" font-family="system-ui, sans-serif" font-size="34" font-weight="700">软件测试五阶段学习路线</text>
  <text x="64" y="108" fill="#587083" font-family="system-ui, sans-serif" font-size="18">先形成测试思维，再逐步增加技术深度，最终用项目完成求职闭环</text>
  <path d="M112 280 H1088" stroke="#ed7654" stroke-width="8" stroke-linecap="round"/>
  <g font-family="system-ui, sans-serif">
    <g transform="translate(54 150)">
      <rect width="200" height="270" rx="22" fill="#103653"/>
      <circle cx="100" cy="130" r="34" fill="#f7f1e6" stroke="#ed7654" stroke-width="8"/>
      <text x="100" y="141" text-anchor="middle" fill="#103653" font-size="30" font-weight="700">1</text>
      <text x="100" y="42" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">测试基础</text>
      <text x="100" y="190" text-anchor="middle" fill="#dbe7eb" font-size="16">流程与测试类型</text>
      <text x="100" y="222" text-anchor="middle" fill="#dbe7eb" font-size="16">用例设计方法</text>
      <text x="100" y="254" text-anchor="middle" fill="#dbe7eb" font-size="16">Bug生命周期</text>
    </g>
    <g transform="translate(277 150)">
      <rect width="200" height="270" rx="22" fill="#ffffff" stroke="#cfdad9" stroke-width="2"/>
      <circle cx="100" cy="130" r="34" fill="#f7f1e6" stroke="#ed7654" stroke-width="8"/>
      <text x="100" y="141" text-anchor="middle" fill="#103653" font-size="30" font-weight="700">2</text>
      <text x="100" y="42" text-anchor="middle" fill="#103653" font-size="22" font-weight="700">工具与Web</text>
      <text x="100" y="190" text-anchor="middle" fill="#587083" font-size="16">缺陷管理工具</text>
      <text x="100" y="222" text-anchor="middle" fill="#587083" font-size="16">浏览器开发者工具</text>
      <text x="100" y="254" text-anchor="middle" fill="#587083" font-size="16">Web功能测试</text>
    </g>
    <g transform="translate(500 150)">
      <rect width="200" height="270" rx="22" fill="#ffffff" stroke="#cfdad9" stroke-width="2"/>
      <circle cx="100" cy="130" r="34" fill="#f7f1e6" stroke="#ed7654" stroke-width="8"/>
      <text x="100" y="141" text-anchor="middle" fill="#103653" font-size="30" font-weight="700">3</text>
      <text x="100" y="42" text-anchor="middle" fill="#103653" font-size="22" font-weight="700">技术基础</text>
      <text x="100" y="190" text-anchor="middle" fill="#587083" font-size="16">MySQL查询</text>
      <text x="100" y="222" text-anchor="middle" fill="#587083" font-size="16">Linux与日志</text>
      <text x="100" y="254" text-anchor="middle" fill="#587083" font-size="16">HTTP与接口测试</text>
    </g>
    <g transform="translate(723 150)">
      <rect width="200" height="270" rx="22" fill="#ffffff" stroke="#cfdad9" stroke-width="2"/>
      <circle cx="100" cy="130" r="34" fill="#f7f1e6" stroke="#ed7654" stroke-width="8"/>
      <text x="100" y="141" text-anchor="middle" fill="#103653" font-size="30" font-weight="700">4</text>
      <text x="100" y="42" text-anchor="middle" fill="#103653" font-size="22" font-weight="700">自动化测试</text>
      <text x="100" y="190" text-anchor="middle" fill="#587083" font-size="16">Python基础</text>
      <text x="100" y="222" text-anchor="middle" fill="#587083" font-size="16">requests与pytest</text>
      <text x="100" y="254" text-anchor="middle" fill="#587083" font-size="16">Git与持续集成</text>
    </g>
    <g transform="translate(946 150)">
      <rect width="200" height="270" rx="22" fill="#197b78"/>
      <circle cx="100" cy="130" r="34" fill="#f7f1e6" stroke="#ed7654" stroke-width="8"/>
      <text x="100" y="141" text-anchor="middle" fill="#103653" font-size="30" font-weight="700">5</text>
