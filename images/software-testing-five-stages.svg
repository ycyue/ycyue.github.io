  <text x="600" y="482" text-anchor="middle" fill="#587083" font-family="system-ui, sans-serif" font-size="17">学习成果：测试用例 → Bug报告 → SQL与接口集合 → 自动化代码 → 可讲清楚的完整项目</text>
