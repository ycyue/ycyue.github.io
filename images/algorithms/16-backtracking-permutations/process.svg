<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
  <title id="title">排列型回溯：搜索树</title>
  <desc id="desc">排列型回溯：搜索树的教学图解</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527987"/></marker></defs>
  <style>
  .bg{fill:#f7fafc}.card{fill:#fff;stroke:#a9bbc6;stroke-width:2}.accent{fill:#286f88}
  .soft{fill:#e8f4f7}.line{stroke:#527987;stroke-width:3;fill:none;marker-end:url(#arrow)}
  .title{font:700 26px system-ui,sans-serif;fill:#18313b}.head{font:700 18px system-ui,sans-serif;fill:#18313b}
  .body{font:15px system-ui,sans-serif;fill:#38505a}.small{font:14px system-ui,sans-serif;fill:#526873}
  .node{fill:#fff;stroke:#286f88;stroke-width:2}.edge{stroke:#6a8792;stroke-width:2}.good{fill:#dff4e7;stroke:#4b9870;stroke-width:2}
  .warn{fill:#fff0e1;stroke:#bd7740;stroke-width:2}
</style>
  <rect class="bg" width="960" height="530" rx="20"/>
  <text x="48" y="52" class="title">排列型回溯：搜索树</text>
  <line x1="480" y1="145" x2="220" y2="205" class="edge"/><line x1="480" y1="145" x2="480" y2="205" class="edge"/><line x1="480" y1="145" x2="740" y2="205" class="edge"/><line x1="220" y1="255" x2="130" y2="335" class="edge"/><line x1="220" y1="255" x2="310" y2="335" class="edge"/><line x1="480" y1="255" x2="650" y2="335" class="edge"/><rect x="426" y="96" width="108" height="48" rx="12" class="node"/><text x="480" y="126" text-anchor="middle" class="head">[]</text><rect x="166" y="206" width="108" height="48" rx="12" class="node"/><text x="220" y="236" text-anchor="middle" class="head">[1]</text><rect x="426" y="206" width="108" height="48" rx="12" class="node"/><text x="480" y="236" text-anchor="middle" class="head">[2]</text><rect x="686" y="206" width="108" height="48" rx="12" class="node"/><text x="740" y="236" text-anchor="middle" class="head">[3]</text><rect x="76" y="336" width="108" height="48" rx="12" class="good"/><text x="130" y="366" text-anchor="middle" class="head">[1,2]</text><rect x="256" y="336" width="108" height="48" rx="12" class="good"/><text x="310" y="366" text-anchor="middle" class="head">[1,3]</text><rect x="596" y="336" width="108" height="48" rx="12" class="good"/><text x="650" y="366" text-anchor="middle" class="head">[2,1]</text><rect x="120" y="425" width="720" height="68" rx="14" class="soft"/><text x="150" y="456" class="body">第 depth 层决定排列的第 depth 个位置；尝试每个尚未使用的元素，递归后恢复 used</text>
<text x="150" y="478" class="body">。</text>
</svg>
