name: Publish blog

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "_config.yml"
      - "_config.typography.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-blog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Typography theme
        run: |
          git clone https://github.com/SumiMakito/hexo-theme-typography.git themes/typography
          git -C themes/typography checkout ddbe45aabe5ee3d431426cbd6c2f62ae448fc6d1

      - name: Build static site
        run: npm run build

      - name: Copy generated pages to repository root
        run: |
          rsync -a public/ ./
          touch .nojekyll

      - name: Publish generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Publish blog [skip ci]"
            git push
          fi
